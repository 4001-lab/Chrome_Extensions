<!doctype html><html><head><meta charset="utf-8"><title>Scholar Navigator</title><link rel="stylesheet" href="styles.css"></head>
<body><main><h1>📚 Scholar Navigator</h1>
<label class="file">Select PDF files<input id="files" type="file" accept=".pdf,application/pdf" multiple></label>
<div class="stats"><div><span>Total</span><b id="total">0</b></div><div><span>Processed</span><b id="processed">0</b></div><div><span>Remaining</span><b id="remaining">0</b></div></div>
<div class="current" id="current">No PDFs loaded.</div>
<div id="bibcount"></div>
<button id="download">⬇ Download saved BibTeX (.bib)</button>
<div id="status"></div><button id="reset">Reset list & saved BibTeX</button>
<p>After loading PDFs, use the floating Navigator on Google Scholar.</p></main><script src="popup.js"></script></body></html>
